name: SingleFileGPT Selftest

on:
  push:
    branches: [main]
  pull_request:

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Run SingleFileGPT.java selftest (79 checks, 0 deps)
        run: java SingleFileGPT.java selftest
